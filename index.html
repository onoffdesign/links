<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONOFF Links</title>
<meta name="description" content="ONOFF, studio di design e comunicazione. Progetti, articoli e contatti.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="ONOFF">
<meta property="og:description" content="Studio di design e comunicazione. Progetti, articoli e contatti.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --white: #ffffff;
    --paper: #f7f7f7;
    --sky: #bbddff;
    --ice: #cceeff;
    --mute: #9a9a9a;
    --line: rgba(255, 255, 255, 0.14);
    --col: 560px;
  }
  * { box-sizing: border-box; }
  html { background: var(--black); color-scheme: dark; }
  body {
    margin: 0;
    background: var(--black);
    color: var(--white);
    font-family: Figtree, "Figtree Placeholder", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.2;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }

  .wrap {
    max-width: var(--col);
    margin: 0 auto;
    padding-top: 0;
    padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* Header: the one bold moment, an echo of the drifting blobs in the onoff.zone hero */
  .hero {
    position: relative;
    isolation: isolate;
    padding: 56px 0 28px;
    text-align: center;
    overflow: hidden;
  }
  .blob {
    position: absolute;
    z-index: -1;
    border-radius: 50%;
    background: var(--white);
    filter: blur(28px);
    opacity: 0.9;
  }
  .blob.a { width: 220px; height: 130px; top: -40px; left: 58%; animation: drift-a 18s ease-in-out infinite alternate; }
  .blob.b { width: 110px; height: 110px; top: 10px; left: 4%; opacity: 0.45; animation: drift-b 22s ease-in-out infinite alternate; }
  .blob.c { width: 70px; height: 90px; top: 150px; left: 74%; opacity: 0.35; background: var(--ice); animation: drift-a 26s ease-in-out infinite alternate-reverse; }
  @keyframes drift-a { from { transform: translate(0, 0) scale(1); } to { transform: translate(-60px, 30px) scale(1.15); } }
  @keyframes drift-b { from { transform: translate(0, 0) scale(1); } to { transform: translate(50px, -20px) scale(0.85); } }

  .logo {
    display: inline-block;
    width: 72px;
    color: var(--white);
    mix-blend-mode: difference;
  }
  .logo svg { display: block; width: 100%; height: auto; }
  .tagline {
    margin: 16px 0 0;
    font-size: 17px;
    font-weight: 500;
    color: var(--paper);
    text-shadow: 0 0 18px rgba(0, 0, 0, 0.55);
  }

  /* Pill nav, same shape and material as the onoff.zone header */
  .pill {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    margin: 0 0 20px;
    padding: 6px;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.30), rgba(255, 255, 255, 0.08));
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid var(--line);
  }
  .pill a {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 6px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    transition: background-color 0.2s, color 0.2s;
  }
  .pill a:hover { background: var(--white); color: var(--black); }

  /* Instagram-style grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    margin: 0;
    padding: 0;
    list-style: none;
    border-radius: 14px;
    overflow: hidden;
  }
  .tile {
    position: relative;
    display: block;
    aspect-ratio: 4 / 5;
    background: #1a1a1a;
    overflow: hidden;
  }
  .tile img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease, opacity 0.4s ease;
    opacity: 0;
  }
  .tile img.ready { opacity: 1; }
  .tile::after {
    content: "";
    position: absolute;
    inset: 45% 0 0;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.72));
    pointer-events: none;
  }
  .tile span {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 7px;
    z-index: 1;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.01em;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .tile:hover img { transform: scale(1.04); }
  .tile:focus-visible { outline-offset: -3px; }

  .note {
    margin: 14px 0 0;
    font-size: 14px;
    color: var(--mute);
    text-align: center;
  }

  footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 12px 24px;
    font-size: 14px;
    color: var(--mute);
  }
  footer a { color: var(--white); font-weight: 500; }
  footer a:hover { color: var(--sky); }
  footer address { font-style: normal; line-height: 1.4; }

  @media (min-width: 600px) {
    .hero { padding-top: 80px; }
    .logo { width: 84px; }
    .tile span { font-size: 13px; left: 10px; bottom: 9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
    .tile img { transition: none; }
    .tile:hover img { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="blob a" aria-hidden="true"></div>
    <div class="blob b" aria-hidden="true"></div>
    <div class="blob c" aria-hidden="true"></div>
    <a class="logo" href="https://onoff.zone/it/" aria-label="ONOFF, vai al sito">
      <svg viewBox="0 0 50.033 41.014" fill="currentColor" aria-hidden="true"><path d="M 32.551 0.249 L 37.178 0.249 L 37.178 19.298 L 33.133 19.298 L 27.287 8.903 L 27.287 19.298 L 22.66 19.298 L 22.66 0.249 L 26.842 0.249 L 32.549 10.507 L 32.549 0.249 Z M 27.344 40.767 L 22.662 40.767 L 22.662 21.719 L 34.934 21.719 L 34.934 25.755 L 27.344 25.755 L 27.344 29.405 L 33.357 29.405 L 33.357 33.387 L 27.344 33.387 L 27.344 40.769 Z M 42.443 40.767 L 37.76 40.767 L 37.76 21.719 L 50.033 21.719 L 50.033 25.755 L 42.443 25.755 L 42.443 29.405 L 48.455 29.405 L 48.455 33.387 L 42.443 33.387 L 42.443 40.769 Z M 42.264 4.174 C 42.264 3.088 42.641 2.166 43.387 1.401 C 44.143 0.636 45.066 0.247 46.143 0.247 C 47.221 0.247 48.143 0.636 48.9 1.401 C 49.656 2.166 50.033 3.086 50.033 4.174 C 50.033 5.261 49.656 6.182 48.9 6.946 C 48.143 7.711 47.221 8.09 46.143 8.09 C 45.066 8.09 44.143 7.713 43.387 6.946 C 42.643 6.182 42.264 5.261 42.264 4.174 Z M 42.887 4.174 C 42.887 5.084 43.199 5.859 43.832 6.503 C 44.465 7.135 45.232 7.456 46.143 7.456 C 47.055 7.456 47.822 7.135 48.455 6.503 C 49.088 5.859 49.4 5.084 49.4 4.174 C 49.4 3.264 49.088 2.489 48.455 1.844 C 47.822 1.2 47.055 0.879 46.143 0.879 C 45.232 0.879 44.465 1.2 43.832 1.844 C 43.199 2.489 42.887 3.264 42.887 4.174 Z M 46.955 6.159 L 45.945 4.75 L 45.533 4.75 L 45.533 6.159 L 44.922 6.159 L 44.922 2.278 L 46.4 2.278 C 47.189 2.278 47.623 2.844 47.623 3.519 C 47.623 4.096 47.279 4.628 46.668 4.728 L 47.691 6.159 L 46.957 6.159 Z M 45.533 4.153 L 46.377 4.153 C 47.221 4.186 47.211 2.857 46.4 2.889 L 45.533 2.889 Z M 19.475 9.787 C 19.475 7.077 18.533 4.783 16.623 2.875 C 14.738 0.967 12.439 0 9.723 0 C 7.008 0 4.738 0.967 2.826 2.875 C 0.943 4.783 0 7.077 0 9.787 L 0 31.309 C 0.012 33.97 0.953 36.274 2.852 38.168 C 4.764 40.076 7.035 41.014 9.723 41.014 C 12.412 41.014 14.738 40.074 16.621 38.168 C 18.52 36.272 19.461 33.97 19.473 31.309 L 19.473 9.787 Z M 13.326 13.408 C 12.357 14.404 11.137 14.901 9.723 14.901 C 8.309 14.901 7.119 14.404 6.15 13.408 C 5.18 12.412 4.68 11.196 4.68 9.787 C 4.68 8.378 5.178 7.161 6.15 6.165 C 7.119 5.143 8.309 4.644 9.723 4.644 C 11.137 4.644 12.328 5.141 13.326 6.165 C 14.324 7.161 14.822 8.378 14.822 9.787 C 14.822 11.196 14.324 12.412 13.326 13.408 Z"/></svg>
    </a>
    <p class="tagline">Studio di design e comunicazione</p>
  </header>

  <nav class="pill" id="links" aria-label="Link principali">
    <a href="https://onoff.zone/it/">Sito</a>
    <a href="https://onoff.zone/it/projects">Progetti</a>
    <a href="https://onoff.zone/it/mag">Mag</a>
    <a href="mailto:hello@onoff.zone">Contatti</a>
  </nav>

  <main>
    <ul class="grid" id="grid" aria-label="Post Instagram e progetti collegati"></ul>
    <p class="note">Tocca un post per aprire il progetto sul sito.</p>
  </main>

  <footer>
    <address>ONOFF SRL<br>Via Vicenza 4, Treviso</address>
    <div>
      <a href="mailto:hello@onoff.zone">hello@onoff.zone</a><br>
      <a href="https://www.instagram.com/onoff.zone/">Instagram</a>
    </div>
  </footer>
</div>

<script>
(async function () {
  const grid = document.getElementById('grid');
  let data;
  try {
    const res = await fetch('posts.json', { cache: 'no-cache' });
    data = await res.json();
  } catch (e) {
    grid.outerHTML = '<p class="note">I progetti non si sono caricati. Apri <a href="https://onoff.zone/it/projects">onoff.zone</a>.</p>';
    return;
  }

  if (Array.isArray(data.links) && data.links.length) {
    const nav = document.getElementById('links');
    nav.innerHTML = '';
    data.links.forEach(function (l) {
      const a = document.createElement('a');
      a.href = l.url;
      a.textContent = l.label;
      nav.appendChild(a);
    });
  }

  (data.posts || []).forEach(function (p, i) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = p.url;
    a.setAttribute('aria-label', p.title);

    const img = document.createElement('img');
    img.alt = '';
    img.loading = i < 6 ? 'eager' : 'lazy';
    img.decoding = 'async';
    img.addEventListener('load', function () { img.classList.add('ready'); });
    img.addEventListener('error', function () {
      if (p.source_image && img.src !== p.source_image) img.src = p.source_image;
    });
    img.src = p.image || p.source_image;

    const label = document.createElement('span');
    label.textContent = p.title;

    a.appendChild(img);
    a.appendChild(label);
    li.appendChild(a);
    grid.appendChild(li);
  });
})();
</script>
</body>
</html>
